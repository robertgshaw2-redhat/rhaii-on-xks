apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-32b-vllm
  namespace: llm-d-rhaii
  labels:
    app: qwen3-32b-vllm
spec:
  replicas: 16
  selector:
    matchLabels:
      app: qwen3-32b-vllm
  template:
    metadata:
      labels:
        app: qwen3-32b-vllm
    spec:
      containers:
        - name: vllm
          image: registry.redhat.io/rhaiis/vllm-cuda-rhel9@sha256:fc68d623d1bfc36c8cb2fe4a71f19c8578cfb420ce8ce07b20a02c1ee0be0cf3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          command: ["/bin/sh", "-c"]
          args:
            - >
              vllm serve /models
              --served-model-name=Qwen/Qwen3-32B
          volumeMounts:
            - name: model
              mountPath: /models
              subPath: qwen-32b
          resources:
            requests:
              cpu: "8"
              memory: "64Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: "96Gi"
              nvidia.com/gpu: "1"
      volumes:
        - name: model
          persistentVolumeClaim:
            claimName: qwen-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-32b-vllm
  namespace: llm-d-rhaii
  labels:
    app: qwen3-32b-vllm
spec:
  type: ClusterIP
  selector:
    app: qwen3-32b-vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
